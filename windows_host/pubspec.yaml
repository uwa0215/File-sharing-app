name: windows_host
description: "DeviceBridge — Windows-only USB plug-and-play phone explorer, file transfer, and screen mirror."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.9.2
  super_drag_and_drop: ^0.9.1
  win32: ^5.15.0
  ffi: ^2.2.0
  file_picker: ^7.0.2
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
